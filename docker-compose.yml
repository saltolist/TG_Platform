name: tg_platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tg}
      POSTGRES_DB: ${POSTGRES_DB:-tg}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/scripts/docker-init-test-db.sh:/docker-entrypoint-initdb.d/02-create-test-db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: tg-platform-backend:local
    build:
      context: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tg}:${POSTGRES_PASSWORD:-tg}@postgres:5432/${POSTGRES_DB:-tg}
      JWT_SECRET: ${JWT_SECRET:-change-me-please}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3020}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-}
      RAG_ENABLED: ${RAG_ENABLED:-1}
      RAG_SEMANTIC_SUMMARIES_ENABLED: ${RAG_SEMANTIC_SUMMARIES_ENABLED:-1}
      RAG_SEMANTIC_SUMMARY_TIMEOUT_SECONDS: ${RAG_SEMANTIC_SUMMARY_TIMEOUT_SECONDS:-20}
      RAG_SEMANTIC_SUMMARY_INPUT_CHARS: ${RAG_SEMANTIC_SUMMARY_INPUT_CHARS:-6000}
      RAG_STARTUP_BACKFILL_USER_EMAIL: ${RAG_STARTUP_BACKFILL_USER_EMAIL:-}
      RAG_MODE: ${RAG_MODE:-off}
      RAG_TIER_B_ENABLED: ${RAG_TIER_B_ENABLED:-0}
      RAG_INTENT_ROUTING_ENABLED: ${RAG_INTENT_ROUTING_ENABLED:-0}
      RAG_AGENT_MAX_STEPS: ${RAG_AGENT_MAX_STEPS:-4}
      AGENT_RUNTIME_ENGINE: ${AGENT_RUNTIME_ENGINE:-langgraph}
      AGENT_RUNTIME_PHASE1_ENABLED: ${AGENT_RUNTIME_PHASE1_ENABLED:-1}
      AGENT_UNIFIED_CATALOG_V1_ENABLED: ${AGENT_UNIFIED_CATALOG_V1_ENABLED:-0}
      AGENT_TYPED_REQUIREMENTS_V1_ENABLED: ${AGENT_TYPED_REQUIREMENTS_V1_ENABLED:-0}
      AGENT_UNIFIED_SELECTOR_V1_ENABLED: ${AGENT_UNIFIED_SELECTOR_V1_ENABLED:-0}
      AGENT_VERIFIED_PACK_BOUNDARY_V1_ENABLED: ${AGENT_VERIFIED_PACK_BOUNDARY_V1_ENABLED:-0}
      AGENT_PLANNER_POLICY_V1_ENABLED: ${AGENT_PLANNER_POLICY_V1_ENABLED:-0}
      AGENT_SELECTOR_MODEL: ${AGENT_SELECTOR_MODEL:-}
      AGENT_UNIFIED_DEFAULT_ON: ${AGENT_UNIFIED_DEFAULT_ON:-0}
      AGENT_TURN_CONTRACT_V2_ENABLED: ${AGENT_TURN_CONTRACT_V2_ENABLED:-1}
      AGENT_BATCH_PATH_V1_ENABLED: ${AGENT_BATCH_PATH_V1_ENABLED:-1}
      AGENT_ADAPTIVE_EVIDENCE_DEPTH_V1_ENABLED: ${AGENT_ADAPTIVE_EVIDENCE_DEPTH_V1_ENABLED:-1}
      AGENT_DIALOG_CONTEXT_V2: ${AGENT_DIALOG_CONTEXT_V2:-1}
      AGENT_REFERENT_RESOLUTION_LEGACY: ${AGENT_REFERENT_RESOLUTION_LEGACY:-0}
      AGENT_FINISH_WITHOUT_RESEARCH: ${AGENT_FINISH_WITHOUT_RESEARCH:-1}
      RAG_L2_ENGINE: ${RAG_L2_ENGINE:-langgraph}
      AGENT_ACTIONS_ENABLED: ${AGENT_ACTIONS_ENABLED:-0}
      AGENT_MEDIA_ENABLED: ${AGENT_MEDIA_ENABLED:-0}
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed
      EMBEDDING_MODEL_LOCAL: ${EMBEDDING_MODEL_LOCAL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      AI_CONTEXT_LOG: ${AI_CONTEXT_LOG:-0}
      AI_CONTEXT_LOG_CHAT: ${AI_CONTEXT_LOG_CHAT:-}
      AI_CONTEXT_STAMPS: ${AI_CONTEXT_STAMPS:-0}
      MEDIA_STORAGE_ROOT: /app/media
      MEDIA_PUBLIC_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_PUBLISH_MAX_RETRIES: ${TELEGRAM_PUBLISH_MAX_RETRIES:-3}
      TELEGRAM_RPC_TIMEOUT_SECONDS: ${TELEGRAM_RPC_TIMEOUT_SECONDS:-60}
      TELEGRAM_LISTENER_STOP_TIMEOUT_SECONDS: ${TELEGRAM_LISTENER_STOP_TIMEOUT_SECONDS:-35}
      TELEGRAM_CLOCK_SYNC_ENABLED: ${TELEGRAM_CLOCK_SYNC_ENABLED:-1}
      # API replicas: live-sync runs in sync-worker service (set 0 here).
      TELEGRAM_LIVE_SYNC_ENABLED: ${TELEGRAM_LIVE_SYNC_ENABLED:-0}
      TELEGRAM_LIVE_SYNC_REGISTRY_REFRESH_SECONDS: ${TELEGRAM_LIVE_SYNC_REGISTRY_REFRESH_SECONDS:-30}
      TELEGRAM_LIVE_SYNC_RECONNECT_SECONDS: ${TELEGRAM_LIVE_SYNC_RECONNECT_SECONDS:-15}
      # Docker often drops Telethon push updates; poll as a fallback.
      TELEGRAM_LIVE_SYNC_FAST_POLL_SECONDS: ${TELEGRAM_LIVE_SYNC_FAST_POLL_SECONDS:-45}
      TELEGRAM_CHANNEL_MAINTENANCE_SECONDS: ${TELEGRAM_CHANNEL_MAINTENANCE_SECONDS:-90}
      TELEGRAM_ALBUM_DEBOUNCE_SECONDS: ${TELEGRAM_ALBUM_DEBOUNCE_SECONDS:-2}
      TELEGRAM_PROXY_TYPE: ${TELEGRAM_PROXY_TYPE:-}
      TELEGRAM_PROXY_HOST: ${TELEGRAM_PROXY_HOST:-}
      TELEGRAM_PROXY_PORT: ${TELEGRAM_PROXY_PORT:-0}
      TELEGRAM_PROXY_SECRET: ${TELEGRAM_PROXY_SECRET:-}
      TELEGRAM_PROXY_USERNAME: ${TELEGRAM_PROXY_USERNAME:-}
      TELEGRAM_PROXY_PASSWORD: ${TELEGRAM_PROXY_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media-data:/app/media
      - /etc/localtime:/etc/localtime:ro

  sync-worker:
    image: tg-platform-backend:local
    entrypoint: ./scripts/entrypoint-sync-worker.sh
    restart: unless-stopped
    environment:
      <<: *backend-env
      TELEGRAM_LIVE_SYNC_ENABLED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media-data:/app/media
      - /etc/localtime:/etc/localtime:ro

  celery-worker:
    image: tg-platform-backend:local
    entrypoint: ./scripts/entrypoint-celery.sh
    command: worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      PROMETHEUS_PUSHGATEWAY_URL: ${PROMETHEUS_PUSHGATEWAY_URL:-http://pushgateway:9091}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      PROMETHEUS_METRICS_PORT: 9108
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pushgateway:
        condition: service_started
    volumes:
      - media-data:/app/media
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --destination=celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  celery-heavy-worker:
    image: tg-platform-backend:local
    entrypoint: ./scripts/entrypoint-celery.sh
    command: heavy
    restart: unless-stopped
    environment:
      <<: *backend-env
      PROMETHEUS_PUSHGATEWAY_URL: ${PROMETHEUS_PUSHGATEWAY_URL:-http://pushgateway:9091}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      PROMETHEUS_METRICS_PORT: 9108
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pushgateway:
        condition: service_started
    volumes:
      - media-data:/app/media
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --destination=celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-batch-worker:
    image: tg-platform-backend:local
    entrypoint: ./scripts/entrypoint-celery.sh
    command: batch
    restart: unless-stopped
    environment:
      <<: *backend-env
      PROMETHEUS_PUSHGATEWAY_URL: ${PROMETHEUS_PUSHGATEWAY_URL:-http://pushgateway:9091}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      PROMETHEUS_METRICS_PORT: 9108
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pushgateway:
        condition: service_started
    volumes:
      - media-data:/app/media
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --destination=celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway
      - alertmanager
      - celery-worker
      - celery-heavy-worker
      - celery-batch-worker

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  celery-beat:
    image: tg-platform-backend:local
    entrypoint: ./scripts/entrypoint-celery.sh
    command: beat
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media-data:/app/media
      - /etc/localtime:/etc/localtime:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MSW: "0"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
    name: tg_platform_postgres-data
  minio-data:
    name: tg_platform_minio-data
  media-data:
    name: tg_platform_media-data
  redis-data:
    name: tg_platform_redis-data
  prometheus-data:
    name: tg_platform_prometheus-data
  grafana-data:
    name: tg_platform_grafana-data
